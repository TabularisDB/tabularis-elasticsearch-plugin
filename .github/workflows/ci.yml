name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 2"

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.3
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          ELASTIC_PASSWORD: "secret@123"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        options: >-
          --health-cmd "curl --fail --silent -u elastic:secret@123 http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Seed Elasticsearch fixture
        run: |
          curl --fail --silent --show-error -u 'elastic:secret@123' \
            -X PUT http://localhost:9200/posts -H 'Content-Type: application/json' \
            --data @testdata/posts-index-mapping.json
          curl --fail --silent --show-error -u 'elastic:secret@123' \
            -X POST http://localhost:9200/posts/_bulk -H 'Content-Type: application/x-ndjson' \
            --data-binary @testdata/posts.ndjson
          curl --fail --silent --show-error -u 'elastic:secret@123' \
            -X POST http://localhost:9200/posts/_refresh
      - run: cargo test --locked --all-targets

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
